info:
  name: 【发布订阅】多发布者多订阅者，每个订阅者均能受到不同的消息
  input: 同一主题下的 3 个发布者分别发送不同文本，3 个订阅者同时接收
  expected: 每个订阅者均能找到全部 3 种发布内容
steps:
  - name: lpss_msg_strcollect
    args:
      - kdt_multi_pub_multi_subscriber_1
      - /kdt/pubsub/multi-pub-multi-sub
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_multi_pub_multi_subscriber_2
      - /kdt/pubsub/multi-pub-multi-sub
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_multi_pub_multi_subscriber_3
      - /kdt/pubsub/multi-pub-multi-sub
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_multi_pub_multi_publisher_1
      - /kdt/pubsub/multi-pub-multi-sub
      - KDT LPSS multi publisher 1
      - 20
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_multi_pub_multi_publisher_2
      - /kdt/pubsub/multi-pub-multi-sub
      - KDT LPSS multi publisher 2
      - 20
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_multi_pub_multi_publisher_3
      - /kdt/pubsub/multi-pub-multi-sub
      - KDT LPSS multi publisher 3
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 3
      - true
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step7 }}"
      - - KDT LPSS multi publisher 1
        - KDT LPSS multi publisher 2
        - KDT LPSS multi publisher 3
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step2 }}"
      - 3
      - true
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step9 }}"
      - - KDT LPSS multi publisher 1
        - KDT LPSS multi publisher 2
        - KDT LPSS multi publisher 3
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step3 }}"
      - 3
      - true
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step11 }}"
      - - KDT LPSS multi publisher 1
        - KDT LPSS multi publisher 2
        - KDT LPSS multi publisher 3
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_multi_pub_multi_publisher_1
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_multi_pub_multi_publisher_2
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_multi_pub_multi_publisher_3
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_multi_pub_multi_subscriber_1
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_multi_pub_multi_subscriber_2
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_multi_pub_multi_subscriber_3
