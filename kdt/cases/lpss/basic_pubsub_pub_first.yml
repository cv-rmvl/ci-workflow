info:
  name: 【发布订阅】发布端先启动时正常通信
  input: 发布端先启动并以 20 ms 周期发送固定文本，随后启动订阅端
  expected: 订阅端能够发现发布端并连续收到相同文本
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-basic-pubsub-pub-first
  - name: fs_create_dir
    dep: true
    args:
      - - tmp-lpss-basic-pubsub-pub-first
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_basic_pub_first_publisher
      - /kdt/basic/pubsub/pub-first
      - KDT LPSS publisher first
      - 20
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: lpss_msg_strsub
    dep: true
    args:
      - kdt_basic_pub_first_subscriber
      - /kdt/basic/pubsub/pub-first
      - tmp-lpss-basic-pubsub-pub-first/received.txt
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: fs_slice
    dep: true
    args:
      - tmp-lpss-basic-pubsub-pub-first/received.txt
      - 1
      - tmp-lpss-basic-pubsub-pub-first/line-1.txt
  - name: assert_equal
    dep: true
    args:
      - "{{ step7 }}"
      - KDT LPSS publisher first
  - name: fs_slice
    dep: true
    args:
      - tmp-lpss-basic-pubsub-pub-first/received.txt
      - 2
      - tmp-lpss-basic-pubsub-pub-first/line-2.txt
  - name: assert_equal
    dep: true
    args:
      - "{{ step9 }}"
      - KDT LPSS publisher first
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_basic_pub_first_publisher
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_basic_pub_first_subscriber
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-basic-pubsub-pub-first
