info:
  name: 【发布订阅】发布端先启动时正常通信
  input: 发布端先启动并以 20 ms 周期发送固定文本，随后启动订阅端
  expected: 订阅端能够发现发布端并连续收到相同文本
steps:
  - name: lpss_msg_strpub
    args:
      - kdt_basic_pub_first_publisher
      - /kdt/basic/pubsub/pub-first
      - KDT LPSS publisher first
      - 20
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_basic_pub_first_subscriber
      - /kdt/basic/pubsub/pub-first
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step2 }}"
      - 2
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step3 }}"
      - - KDT LPSS publisher first
        - KDT LPSS publisher first
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_basic_pub_first_publisher
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_basic_pub_first_subscriber
