info:
  name: 【发布订阅】复杂消息结构的序列化与反序列化验证
  input: 包含基础类型、字符串和序列字段的 TestTypes 消息
  expected: 消息经发布、序列化、传输和反序列化后全部字段保持一致
steps:
  - name: lpss_msg_testcheck
    args:
      - kdt_test_types_subscriber
      - /kdt/test_types/pubsub
  - name: lpss_msg_testpub
    dep: true
    args:
      - kdt_test_types_publisher
      - /kdt/test_types/pubsub
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step3 }}"
      - pass
  - name: lpss_stop
    args:
      - msg.testpub
      - SIGTERM
      - kdt_test_types_publisher
  - name: lpss_stop
    args:
      - msg.testsub
      - SIGTERM
      - kdt_test_types_subscriber
