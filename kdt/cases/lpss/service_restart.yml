info:
  name: 【服务】服务正常退出后重新上线，客户端能正常调用
  background: 客户端能够正常发现并调用已上线的 SetBool 服务
  input: 正常终止服务，验证离线超时后使用相同服务名重新上线
  expected: 离线期间客户端正常超时，服务重启后能够再次调用并获得正确响应
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-service-restart
  - name: fs_create_dir
    dep: true
    args:
      - - tmp-lpss-service-restart
  - name: lpss_srv_strservice
    dep: true
    args:
      - kdt_service_restart_server
      - /kdt/service/restart/set_enabled
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: lpss_srv_strclient
    dep: true
    args:
      - kdt_service_restart_before_client
      - /kdt/service/restart/set_enabled
      - true
      - tmp-lpss-service-restart/before-response.txt
      - 3000
  - name: fs_write
    dep: true
    args:
      - tmp-lpss-service-restart/before-expected.txt
      - |-
        success: true
        message: enabled
  - name: fs_same
    dep: true
    args:
      - tmp-lpss-service-restart/before-response.txt
      - tmp-lpss-service-restart/before-expected.txt
  - name: lpss_stop
    dep: true
    args:
      - srv.service
      - SIGTERM
      - kdt_service_restart_server
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: lpss_srv_timeout
    dep: true
    args:
      - kdt_service_restart_offline_client
      - /kdt/service/restart/set_enabled
      - 300
  - name: lpss_srv_strservice
    dep: true
    args:
      - kdt_service_restart_server
      - /kdt/service/restart/set_enabled
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: lpss_srv_strclient
    dep: true
    args:
      - kdt_service_restart_after_client
      - /kdt/service/restart/set_enabled
      - false
      - tmp-lpss-service-restart/after-response.txt
      - 3000
  - name: fs_write
    dep: true
    args:
      - tmp-lpss-service-restart/after-expected.txt
      - |-
        success: true
        message: disabled
  - name: fs_same
    dep: true
    args:
      - tmp-lpss-service-restart/after-response.txt
      - tmp-lpss-service-restart/after-expected.txt
  - name: lpss_stop
    args:
      - srv.service
      - SIGTERM
      - kdt_service_restart_server
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-service-restart
