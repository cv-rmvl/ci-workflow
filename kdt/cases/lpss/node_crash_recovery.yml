info:
  name: 【节点管理】节点异常退出后通过心跳清理并恢复通信
  background: 通信双方已完成首次发现并能够正常收发消息
  input: 分别使用 SIGKILL 强制终止发布节点和订阅节点，等待心跳清理后重启
  expected: 存活节点能够移除异常节点并发现重启节点，通信自动恢复
steps:
  # Writer 异常退出：Subscriber 始终存活，等待心跳清理后重新发现 Writer。
  - name: lpss_msg_strcollect
    args:
      - kdt_crash_writer_observer
      - /kdt/node/crash/writer
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_crash_writer
      - /kdt/node/crash/writer
      - before writer crash
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step3 }}"
      - before writer crash
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGKILL
      - kdt_crash_writer
  - name: logic_wait
    dep: true
    args:
      - 1
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_crash_writer
      - /kdt/node/crash/writer
      - after writer recovery
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 2
      - true
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step8 }}"
      - - after writer recovery
        - before writer crash
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_crash_writer
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_crash_writer_observer

  # Reader 异常退出：Publisher 始终存活，等待心跳清理后重新发现 Reader。
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_crash_reader_source
      - /kdt/node/crash/reader
      - reader recovery message
      - 20
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_crash_reader
      - /kdt/node/crash/reader
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step13 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step14 }}"
      - reader recovery message
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGKILL
      - kdt_crash_reader
  - name: logic_wait
    dep: true
    args:
      - 1
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_crash_reader
      - /kdt/node/crash/reader
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step18 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step19 }}"
      - reader recovery message
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_crash_reader
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_crash_reader_source
