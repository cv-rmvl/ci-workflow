info:
  name: 【发布订阅】单发布者多订阅者，每个订阅者均能受到发布消息
  input: 单个发布者以 20 ms 周期发送固定文本，3 个订阅者同时接收
  expected: 3 个订阅者均能收到发布内容
steps:
  - name: lpss_msg_strcollect
    args:
      - kdt_one_pub_subscriber_1
      - /kdt/pubsub/one-pub-multi-sub
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_one_pub_subscriber_2
      - /kdt/pubsub/one-pub-multi-sub
  - name: lpss_msg_strcollect
    dep: true
    args:
      - kdt_one_pub_subscriber_3
      - /kdt/pubsub/one-pub-multi-sub
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_one_pub_publisher
      - /kdt/pubsub/one-pub-multi-sub
      - KDT LPSS one publisher to multiple subscribers
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step5 }}"
      - KDT LPSS one publisher to multiple subscribers
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step2 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step7 }}"
      - KDT LPSS one publisher to multiple subscribers
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step3 }}"
      - 1
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step9 }}"
      - KDT LPSS one publisher to multiple subscribers
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_one_pub_publisher
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_one_pub_subscriber_1
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_one_pub_subscriber_2
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_one_pub_subscriber_3
