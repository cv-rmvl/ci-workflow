info:
  name: 【发布订阅】订阅端先启动时正常通信
  input: 订阅端先启动，随后发布端以 20 ms 周期发送固定文本
  expected: 订阅端能够发现发布端并连续收到相同文本
steps:
  - name: lpss_msg_strcollect
    args:
      - kdt_basic_sub_first_subscriber
      - /kdt/basic/pubsub/sub-first
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_basic_sub_first_publisher
      - /kdt/basic/pubsub/sub-first
      - KDT LPSS subscriber first
      - 20
  - name: lpss_wait_result
    dep: true
    args:
      - "{{ step1 }}"
      - 2
      - false
      - 5.0
  - name: assert_equal
    dep: true
    args:
      - "{{ step3 }}"
      - - KDT LPSS subscriber first
        - KDT LPSS subscriber first
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_basic_sub_first_publisher
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_basic_sub_first_subscriber
