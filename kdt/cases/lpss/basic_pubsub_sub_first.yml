info:
  name: 【发布订阅】订阅端先启动时正常通信
  input: 订阅端先启动，随后发布端以 20 ms 周期发送固定文本
  expected: 订阅端能够发现发布端并连续收到相同文本
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-basic-pubsub-sub-first
  - name: fs_create_dir
    dep: true
    args:
      - - tmp-lpss-basic-pubsub-sub-first
  - name: lpss_msg_strsub
    dep: true
    args:
      - kdt_basic_sub_first_subscriber
      - /kdt/basic/pubsub/sub-first
      - tmp-lpss-basic-pubsub-sub-first/received.txt
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: lpss_msg_strpub
    dep: true
    args:
      - kdt_basic_sub_first_publisher
      - /kdt/basic/pubsub/sub-first
      - KDT LPSS subscriber first
      - 20
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: fs_slice
    dep: true
    args:
      - tmp-lpss-basic-pubsub-sub-first/received.txt
      - 1
      - tmp-lpss-basic-pubsub-sub-first/line-1.txt
  - name: assert_equal
    dep: true
    args:
      - '{{ step7 }}'
      - KDT LPSS subscriber first
  - name: fs_slice
    dep: true
    args:
      - tmp-lpss-basic-pubsub-sub-first/received.txt
      - 2
      - tmp-lpss-basic-pubsub-sub-first/line-2.txt
  - name: assert_equal
    dep: true
    args:
      - '{{ step9 }}'
      - KDT LPSS subscriber first
  - name: lpss_stop
    args:
      - msg.strpub
      - SIGTERM
      - kdt_basic_sub_first_publisher
  - name: lpss_stop
    args:
      - msg.strsub
      - SIGTERM
      - kdt_basic_sub_first_subscriber
  - name: fs_remove_recursive
    args:
      - - tmp-lpss-basic-pubsub-sub-first
