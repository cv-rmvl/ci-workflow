info:
  name: 串口多次读写均能正常接收
  background: 运行环境支持 POSIX PTY 且已安装 socat
  input: 通过波特率为 115200 的虚拟串口连续发送 serial multi 01 至 serial multi 10
  expected: 接收文件依次包含全部 10 条消息且内容完全一致
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-serial
  - name: serial_create
    dep: true
    args:
      - tmp-serial/serial-multi-a
      - tmp-serial/serial-multi-b
  - name: fs_write
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - ''
  - name: fs_write
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - ''
  - name: serial_multiread
    dep: true
    args:
      - tmp-serial/serial-multi-b
      - 115200
      - tmp-serial/serial-multi-output.txt
  - name: serial_multiwrite
    dep: true
    args:
      - tmp-serial/serial-multi-a
      - 115200
      - tmp-serial/serial-multi-input.txt
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 01
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 01
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 02
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 02
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 03
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 03
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 04
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 04
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 05
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 05
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 06
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 06
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 07
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 07
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 08
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 08
  - name: logic_wait
    dep: true
    args:
      - 0.1
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-input.txt
      - serial multi 09
  - name: fs_append
    dep: true
    args:
      - tmp-serial/serial-multi-expected.txt
      - serial multi 09
  - name: logic_wait
    dep: true
