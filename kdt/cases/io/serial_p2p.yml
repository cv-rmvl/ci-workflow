info:
  name: 串口点到点互传数据能正常接收
  background: 运行环境支持 POSIX PTY 且已安装 socat
  input:
    - 一对互相连通、波特率为 115200 的虚拟串口
    - '文本 test string: serial p2p'
  expected: 接收端得到与发送内容完全一致的文本
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-serial
  - name: serial_create
    dep: true
    args:
      - tmp-serial/serial-p2p-a
      - tmp-serial/serial-p2p-b
  - name: serial_read
    dep: true
    args:
      - tmp-serial/serial-p2p-b
      - 115200
      - tmp-serial/serial-p2p-output.txt
  - name: logic_wait
    dep: true
    args:
      - 0.05
  - name: serial_write
    dep: true
    args:
      - tmp-serial/serial-p2p-a
      - 115200
      - 'test string: serial p2p'
  - name: logic_wait
    dep: true
    args:
      - 0.2
  - name: fs_write
    dep: true
    args:
      - tmp-serial/serial-p2p-expected.txt
      - 'test string: serial p2p'
  - name: fs_same
    dep: true
    args:
      - tmp-serial/serial-p2p-output.txt
      - tmp-serial/serial-p2p-expected.txt
  - name: serial_remove
    args:
      - tmp-serial/serial-p2p-a
      - tmp-serial/serial-p2p-b
  - name: fs_remove_recursive
    args:
      - - tmp-serial
