info: 【代码生成】Srv 功能验证
steps:
  - name: fs_remove_recursive
    args:
      - - tmp-cgsrv
  - name: fs_create_dir
    dep: true
    args:
      - - tmp-cgsrv/tmpsrv/srv
  - name: fs_write
    dep: true
    args:
      - tmp-cgsrv/CMakeLists.txt
      - |-
        cmake_minimum_required(VERSION 3.16)
        project(kdt-cgtmp)
        find_package(RMVL REQUIRED)
        add_subdirectory(tmpsrv)
        rmvl_add_exe(kdt-cgtmp SOURCES kdt-cgtmp.cpp DEPENDS tmpsrv EXTERNAL fmt)
        add_custom_target(kdt-cgtmp-run COMMAND $<TARGET_FILE:kdt-cgtmp> DEPENDS kdt-cgtmp USES_TERMINAL VERBATIM)
  - name: fs_write
    dep: true
    args:
      - tmp-cgsrv/kdt-cgtmp.cpp
      - |-
        #include <cstddef>
        #include <fmt/format.h>
        #include "rmvlsrv/add.hpp"

        using namespace rm;

        int main() {
            srv::Add::Request x{};
            x.a = 1;
            x.b = 2;
            const auto data = x.serialize();
            for (std::size_t i = 0; i < data.size(); ++i)
                fmt::print("{}{:02x}", i == 0 ? "" : " ", static_cast<uint8_t>(data[i]));
            fmt::println("");
        }
  - name: fs_write
    dep: true
    args:
      - tmp-cgsrv/tmpsrv/srv/Add.srv
      - |-
        int32 a
        int32 b
        ---
        int32 sum
  - name: fs_write
    dep: true
    args:
      - tmp-cgsrv/tmpsrv/CMakeLists.txt
      - |-
        rmvl_generate_srv(Add)
        rmvl_add_module(tmpsrv DEPENDS core)
  - name: fs_command
    dep: true
    args:
      - tmp-cgsrv
      - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
  - name: fs_command
    dep: true
    args:
      - tmp-cgsrv
      - cmake --build build --config Release --target kdt-cgtmp-run --parallel
  - name: fs_remove_recursive
    args:
      - - tmp-cgsrv
