name: Ubuntu 20.04 support for RMVL

on:
  workflow_call:

jobs:
  build_and_test:
    name: Build and test on Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: registry.cn-hangzhou.aliyuncs.com/cv-rmvl/rmvl-u20-base:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt install -y libeigen3-dev libopencv-dev python3-dev pybind11-dev
        curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.12.0/onnxruntime-linux-x64-1.12.0.tgz -o onnxruntime-linux-x64-1.12.0.tgz
        tar -xf onnxruntime-linux-x64-1.12.0.tgz
        mkdir /usr/local/include/onnxruntime
        cd onnxruntime-linux-x64-1.12.0
        cp -r include/* /usr/local/include/onnxruntime
        cp -r lib /usr/local

    - name: Configure RMVL by CMake
      # RMVL 1.x does not support Python, we also can use the CMake option -DBUILD_PYTHON=ON although it is not necessary
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXTRA=ON -DBUILD_TESTS=ON -DBUILD_OPEN62541=ON -DBUILD_PYTHON=ON

    - name: Build RMVL
      run: cmake --build ${{ github.workspace }}/build --parallel 4

    - name: Test RMVL
      run: ctest --test-dir ${{ github.workspace }}/build
