name: Ubuntu 24.04 ARM arch support for RMVL

on:
  workflow_call:

jobs:
  build_and_test:
    name: Build and test on Ubuntu 24.04 (ARM arch)
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libeigen3-dev libopencv-dev pybind11-dev
        curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.18.1/onnxruntime-linux-aarch64-1.18.1.tgz -o onnxruntime-linux-aarch64-1.18.1.tgz
        tar -xf onnxruntime-linux-aarch64-1.18.1.tgz
        sudo mkdir /usr/local/include/onnxruntime
        cd onnxruntime-linux-aarch64-1.18.1
        sudo cp -r include/* /usr/local/include/onnxruntime
        sudo cp -r lib /usr/local

    - name: Configure RMVL by CMake 
      # RMVL 1.x does not support Python, we also can use the CMake option -DBUILD_PYTHON=ON although it is not necessary
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_OPEN62541=ON

    - name: Build RMVL
      run: cmake --build ${{ github.workspace }}/build --parallel 4

    - name: Test RMVL
      run: ctest --test-dir ${{ github.workspace }}/build
