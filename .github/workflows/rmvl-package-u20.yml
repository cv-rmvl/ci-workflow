name: Ubuntu 20.04 support for RMVL

on:
  workflow_call:

jobs:
  package_pipe:
    name: Package on Ubuntu 20.04
    runs-on: ubuntu-latest
    container:
      image: registry.cn-hangzhou.aliyuncs.com/cv-rmvl/rmvl-u20-base:latest

    steps:
    - name: "[RMVL] Checkout repository"
      uses: actions/checkout@v6

    - name: "[RMVL] Configure the project by CMake"
      # RMVL 1.x does not support Python, we also can use the CMake option -DBUILD_PYTHON=ON although it is not necessary
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXTRA=ON -DBUILD_OPEN62541=ON -DBUILD_PYTHON=ON

    - name: "[RMVL] Run build script: Unix Makefile"
      run: cmake --build ${{ github.workspace }}/build --parallel

    - name: "[RMVL] Package RMVL"
      run: |
        cd ${{ github.workspace }}/build
        cpack -G "DEB;TGZ" -D CPACK_PACKAGE_DIRECTORY=${{ github.workspace }}/build/out-package

    - name: "[RMVL] Upload RMVL package"
      uses: actions/upload-artifact@v7
      with:
        name: rmvl-u20-package
        path: |
          ${{ github.workspace }}/build/out-package/*.deb
          ${{ github.workspace }}/build/out-package/*.tar.gz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
