name: Windows ARM arch support for RMVL

on:
  workflow_call:

jobs:
  build_and_test:
    name: Build and test on Windows (without OpenCV)
    runs-on: windows-11-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure RMVL by CMake 
      run: cmake -B ${{ github.workspace }}/build -DBUILD_OPEN62541=ON -DBUILD_TESTS=ON

    - name: Build RMVL
      run: cmake --build ${{ github.workspace }}/build --parallel 4 --config Release

    - name: Test RMVL
      run: ctest --test-dir ${{ github.workspace }}/build
