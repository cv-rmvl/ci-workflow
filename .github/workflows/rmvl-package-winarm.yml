name: Windows ARM arch support for RMVL

on:
  workflow_call:

jobs:
  package_pipe:
    name: Package on Windows (without OpenCV)
    runs-on: windows-11-arm
    steps:
    - name: "[RMVL] Checkout repository"
      uses: actions/checkout@v6

    - name: "[RMVL] Configure the project by CMake"
      run: cmake -B ${{ github.workspace }}/build -DBUILD_OPEN62541=ON

    - name: "[RMVL] Run build script: Visual Studio"
      run: cmake --build ${{ github.workspace }}/build --parallel --config Release

    - name: "[RMVL] Package RMVL"
      run: |
        cd ${{ github.workspace }}/build
        cpack -G "NSIS" -D CPACK_PACKAGE_DIRECTORY=${{ github.workspace }}/build/out-package

    - name: "[RMVL] Upload RMVL package"
      uses: actions/upload-artifact@v7
      with:
        name: rmvl-winarm-package
        path: |
          ${{ github.workspace }}/build/out-package/*.exe
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
