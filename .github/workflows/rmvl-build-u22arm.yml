name: Ubuntu 22.04 ARM arch support for RMVL

on:
  workflow_call:

jobs:
  build_and_test:
    name: Build and test on Ubuntu 22.04 (ARM arch)
    runs-on: ubuntu-22.04-arm
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        echo "Installing dependencies by apt..."
        sudo apt update
        sudo apt install -y libeigen3-dev libopencv-dev python3-dev pybind11-dev
        echo -e "\033[1;34mInstalling dependencies by apt done.\033[0m"
        echo "Installing ONNX Runtime 1.15.0..."
        curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.15.0/onnxruntime-linux-aarch64-1.15.0.tgz -o onnxruntime-linux-aarch64-1.15.0.tgz
        tar -xf onnxruntime-linux-aarch64-1.15.0.tgz
        sudo mkdir /usr/local/include/onnxruntime
        cd onnxruntime-linux-aarch64-1.15.0
        sudo cp -r include/* /usr/local/include/onnxruntime
        sudo cp -r lib /usr/local
        echo -e "\033[1;34mInstalling ONNX Runtime 1.15.0 done.\033[0m"

    - name: Configure the project by CMake 
      # RMVL 1.x does not support Python, we also can use the CMake option -DBUILD_PYTHON=ON although it is not necessary
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXTRA=ON -DBUILD_TESTS=ON -DBUILD_OPEN62541=ON -DBUILD_PYTHON=ON

    - name: "Run build script: Unix Makefile"
      run: cmake --build ${{ github.workspace }}/build --parallel 4

    - name: "Run test script: ctest"
      run: ctest --test-dir ${{ github.workspace }}/build

    - name: Install the project by CMake
      run: sudo cmake --install ${{ github.workspace }}/build

    - name: "[Deploy] Checkout repository"
      uses: actions/checkout@v6
      with:
        repository: cv-rmvl/ci-workflow
        path: deploy-repo

    - name: "[Deploy] Run deploy script"
      run: bash deploy-repo/deploy/scripts/build.sh
