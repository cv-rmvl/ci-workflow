name: Windows support for RMVL

on:
  workflow_call:

jobs:
  package_pipe:
    name: Package on Windows (without OpenCV)
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure the project by CMake 
      run: cmake -B ${{ github.workspace }}/build -DBUILD_OPEN62541=ON

    - name: "Run build script: Visual Studio"
      run: cmake --build ${{ github.workspace }}/build --parallel 4 --config Release

    - name: Package RMVL
      run: |
        cd ${{ github.workspace }}/build
        cpack -G "NSIS" -D CPACK_PACKAGE_DIRECTORY=${{ github.workspace }}/build/out-package

    - name: Upload RMVL package
      uses: actions/upload-artifact@v4
      with:
        name: rmvl-win-package
        path: |
          ${{ github.workspace }}/build/out-package/*.exe
        retention-days: 1
        compression-level: 0
        if-no-files-found: error